name: Extension and public-source checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: python3 scripts/public_check.py
      - run: python3 scripts/package.py
      - run: npx --yes @shopify/cli@4.9.4 app build --no-input
        env:
          SHOPIFY_CLI_NO_ANALYTICS: '1'
